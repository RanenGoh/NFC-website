<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ===================================================================
       PAGE TITLE & DESCRIPTION
       Replace with your own name / company for browser tabs & sharing.
  ==================================================================== -->
  <title>Ranen Goh — Digital Business Card</title>
  <meta name="description" content="Get in touch with Ranen." />
  <meta name="theme-color" content="#121213" />
  <!-- Favicon / browser tab icon — replace these files with your own if
       your logo changes. Generated at multiple sizes for broad support. -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />

  <!-- Inter typeface (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

  <main class="card" role="main">

         IDENTITY
         Replace YOUR_NAME / YOUR_POSITION / YOUR_DESCRIPTION below.
    ================================================================== -->

      <h1 class="identity__name">Ranen Goh</h1>

    <div class="divider" aria-hidden="true"></div>

    ================================================================== -->
